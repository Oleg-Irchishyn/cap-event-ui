apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Chart.Name }}
    tier: {{ .Chart.Name }}
    build: {{ include "helper.BuildVersion" . | lower }}
  name: {{ .Chart.Name }}-svc
spec:
  ports:
  - name: http
    port: {{ .Values.envVars.SERVER_PORT }}
    targetPort: {{ .Values.envVars.SERVER_PORT }}
  selector:
    app: {{ .Chart.Name }}
    tier: {{ .Chart.Name }}
  type: ClusterIP
