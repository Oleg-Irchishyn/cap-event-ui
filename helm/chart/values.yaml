# Supported global values:
global:
  hostname:
  imagePullSecret:

image:
  registry: gen2appsdev.azurecr.io
  name: gen2apps/com.gen2fund.cap-event-ui
  version: # Defaults to .Chart.AppVersion
  # provide an endpoint to verify that app is working. it should response with HTTP 2XX or 3XX
  healthcheck: /

container:
  replicas: 1
  maxUnavailable: 1
  startupProbe:
    failureThreshold: 15
    periodSeconds: 5
  livenessProbe:
    failureThreshold: 4
    periodSeconds: 15
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "500m"

# Use this to configure specific environment variables
envVars:
  SERVER_PORT: 3000
  NEXT_PUBLIC_CAP_EVENT_PACKAGE_API: https://dev.gen2fund.com/cap-event-package
  # TODO: update code to support this
  NEXT_PUBLIC_BACKEND_API: https://dev.gen2fund.com/api/cap-event
  BACKEND_HOST: https://dev.gen2fund.com

# Use this to configure hostname for Ingress
ingress:
  hostname: gen2apps.com
  path: /cap-event
  certificate: default-certificate
